name: Deploy to One.com

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: SFTP Deploy to One.com
        uses: lorenzowain/github-action-sftp-upload@v2
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: 22
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          remote_path: /www/GitTest/
          local_path: ./
          exclude: |
            .git/
            .github/
            README.md