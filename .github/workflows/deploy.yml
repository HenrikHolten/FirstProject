name: Deploy to One.com med Test

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npx jest

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via SFTP (lftp) if tests passed
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          open -u '${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}' sftp://${{ secrets.FTP_SERVER }}:22
          cd /webroots/www/GitTest/ || exit 1
          mirror -R --reverse --delete --verbose \
            --xfer-all \
            --exclude .git/ \
            --exclude .github/ \
            --exclude node_modules/ \
            --exclude package*.json \
            --exclude app.test.js \
            --exclude README.md \
            ./ ./
          bye
          "