name: Deploy to One.com

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via SFTP (lftp)
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          open -u '${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}' sftp://${{ secrets.FTP_SERVER }}:22
          mkdir -p /webroots/www/GitTest/
          cd /webroots/www/GitTest/
          mirror -R --reverse --delete --verbose \
            --exclude-glob .git* \
            --exclude-glob .github* \
            --exclude README.md \
            ./ ./
          bye
          "