name: Deploy to One.com

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: SFTP Deploy to One.com
        uses: Burnett01/rsync-deployments-action@v7.0.1
        with:
          remhost: ${{ secrets.FTP_SERVER }}
          remport: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          target_path: /www/GitTest/
          source_path: ./
          exclude: |
            .git/
            .github/
            README.md